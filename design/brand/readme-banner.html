<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README banner</title>
<!-- Ported from readme-banner.dc.html: same markup and renderVals() math; loops expanded by the script below. -->
<style>
body{margin:0;background:#141210}
.dots{background-image:radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);background-size:16px 16px}
</style>
</head>
<body>
<div class="dots" role="img" aria-label="An old FileMaker screen breaking into blocks that drift right, turn ember orange and rebuild as the new desktop app" style="position: relative; width: 1280px; height: 320px; overflow: hidden; background-color: #141210">

<div aria-hidden="true" style="position: absolute; left: 380px; top: 10px; width: 520px; height: 300px; background: radial-gradient(ellipse at center, rgba(232,100,44,0.30) 0%, rgba(232,100,44,0.10) 40%, rgba(232,100,44,0) 70%)"></div>

<div aria-hidden="true" style="position: absolute; left: 56px; top: 64px; width: 290px; height: 192px; background: #2C3450; overflow: hidden">
  <div style="position: absolute; left: 0; top: 0; width: 290px; height: 32px; background: #2C3450; border-bottom: 1px solid #3A4466"></div>
  <div style="position: absolute; left: 12px; top: 10px; width: 14px; height: 2px; background: #E9ECF3"></div>
  <div style="position: absolute; left: 12px; top: 15px; width: 14px; height: 2px; background: #E9ECF3"></div>
  <div style="position: absolute; left: 12px; top: 20px; width: 14px; height: 2px; background: #E9ECF3"></div>
  <div style="position: absolute; left: 38px; top: 13px; width: 52px; height: 6px; background: #C9CEDB"></div>
  <div style="position: absolute; left: 132px; top: 0; width: 30px; height: 12px; background: #B23A33"></div>
  <div style="position: absolute; left: 0; top: 32px; width: 290px; height: 24px; background: #545E7A"></div>
  <div style="position: absolute; left: 70px; top: 32px; width: 52px; height: 24px; background: #E6E6E6"></div>
  <div style="position: absolute; left: 84px; top: 43px; width: 24px; height: 3px; background: #4B4F5C"></div>
  <div style="position: absolute; left: 136px; top: 43px; width: 22px; height: 3px; background: #C9CEDB"></div>
  <div style="position: absolute; left: 172px; top: 32px; width: 1px; height: 24px; background: #7A839C"></div>
  <div style="position: absolute; left: 186px; top: 43px; width: 22px; height: 3px; background: #C9CEDB"></div>
  <div style="position: absolute; left: 222px; top: 32px; width: 1px; height: 24px; background: #7A839C"></div>
  <div style="position: absolute; left: 236px; top: 43px; width: 22px; height: 3px; background: #C9CEDB"></div>
  <div style="position: absolute; left: 0; top: 56px; width: 290px; height: 18px; background: #E2E2E2"></div>
  <div style="position: absolute; left: 10px; top: 63px; width: 34px; height: 3px; background: #8E9099"></div>
  <div style="position: absolute; left: 96px; top: 63px; width: 26px; height: 3px; background: #8E9099"></div>
  <div style="position: absolute; left: 200px; top: 63px; width: 30px; height: 3px; background: #8E9099"></div>
  <template data-for="gridLines" data-as="g">
    <div style="{{g.style}}"></div>
  </template>
</div>

<template data-for="holes" data-as="h">
  <div aria-hidden="true" style="{{h.style}}"></div>
</template>

<template data-for="particles" data-as="p">
  <div aria-hidden="true" style="{{p.style}}"></div>
</template>

<div aria-hidden="true" style="position: absolute; left: 800px; top: 44px; width: 424px; height: 232px; background: #F4F1EB; border: 1px solid #2E2A26; box-sizing: border-box; overflow: hidden">
  <div style="position: absolute; left: 0; top: 0; width: 92px; height: 232px; background: #1B1917"></div>
  <div style="position: absolute; left: 10px; top: 10px; width: 6px; height: 6px; border-radius: 3px; background: #E5534B"></div>
  <div style="position: absolute; left: 20px; top: 10px; width: 6px; height: 6px; border-radius: 3px; background: #E3A63A"></div>
  <div style="position: absolute; left: 30px; top: 10px; width: 6px; height: 6px; border-radius: 3px; background: #4FB466"></div>
  <div style="position: absolute; left: 10px; top: 28px; width: 12px; height: 12px; background: #E8642C"></div>
  <div style="position: absolute; left: 28px; top: 32px; width: 40px; height: 4px; background: #F4F1EB"></div>
  <template data-for="nav" data-as="n">
    <div style="{{n.row}}"></div>
    <div style="{{n.icon}}"></div>
    <div style="{{n.bar}}"></div>
  </template>
  <div style="position: absolute; left: 92px; top: 0; width: 332px; height: 30px; border-bottom: 1px solid #E2DCD2"></div>
  <div style="position: absolute; left: 170px; top: 8px; width: 150px; height: 14px; background: #FFFFFF; border: 1px solid #E2DCD2; box-sizing: border-box"></div>
  <div style="position: absolute; left: 380px; top: 8px; width: 32px; height: 14px; background: #E8642C"></div>
  <template data-for="kpis" data-as="k">
    <div style="{{k.card}}"></div>
    <div style="{{k.label}}"></div>
    <div style="{{k.value}}"></div>
    <div style="{{k.delta}}"></div>
  </template>
  <div style="position: absolute; left: 102px; top: 98px; width: 196px; height: 124px; background: #FFFFFF; border: 1px solid #E2DCD2; box-sizing: border-box"></div>
  <div style="position: absolute; left: 112px; top: 108px; width: 48px; height: 4px; background: #24211E"></div>
  <div style="position: absolute; left: 112px; top: 210px; width: 176px; height: 1px; background: #E2DCD2"></div>
  <template data-for="bars" data-as="b">
    <div style="{{b.style}}"></div>
  </template>
  <div style="position: absolute; left: 306px; top: 98px; width: 108px; height: 124px; background: #FFFFFF; border: 1px solid #E2DCD2; box-sizing: border-box"></div>
  <template data-for="rows" data-as="r">
    <div style="{{r.line}}"></div>
    <div style="{{r.avatar}}"></div>
    <div style="{{r.name}}"></div>
    <div style="{{r.chip}}"></div>
  </template>
</div>

<template data-for="build" data-as="q">
  <div aria-hidden="true" style="{{q.style}}"></div>
</template>

<div aria-hidden="true" style="position: absolute; left: 0; top: 317px; width: 1280px; height: 3px; background: #E8642C"></div>
</div>
<script>
// Stand-in for the canvas runtime: props come from the source's data-props defaults.
class DCLogic { constructor(props) { this.props = props; } }
class Component extends DCLogic {
  renderVals() {
    var seed = this.props.seed ?? 7;
    var dens = this.props.density ?? 1;
    function rnd(i, j, k) {
      var v = Math.sin(i * 127.1 + j * 311.7 + k * 74.7 + seed * 13.3) * 43758.5453;
      return v - Math.floor(v);
    }
    function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
    function mix(a, b, t) {
      var x = hex(a), y = hex(b);
      return 'rgb(' + Math.round(x[0] + (y[0] - x[0]) * t) + ',' + Math.round(x[1] + (y[1] - x[1]) * t) + ',' + Math.round(x[2] + (y[2] - x[2]) * t) + ')';
    }
    function srcColor(y) {
      if (y < 96) return '#2C3450';
      if (y < 120) return '#545E7A';
      if (y < 138) return '#E2E2E2';
      return '#2C3450';
    }
    var EMBER = '#E8642C', ASH = '#77706A';
    var x0 = 338, x1 = 800, step = 12;
    var particles = [];
    for (var c = 0; c * step + x0 < x1; c++) {
      var x = x0 + c * step;
      var t = (x - x0) / (x1 - x0);
      var arc = Math.sin(Math.PI * t);
      var d = (0.22 + 0.74 * Math.pow(Math.abs(2 * t - 1), 1.4)) * dens;
      for (var r = 0; r < 17; r++) {
        var ySrc = 64 + r * 12;
        if (rnd(c, r, 1) > d) continue;
        var yDst = 48 + r * 13.4;
        var drift = (rnd(c, r, 2) - 0.5) * 70 * arc;
        var y = ySrc + (yDst - ySrc) * t + drift;
        var jx = (rnd(c, r, 3) - 0.5) * 14 * arc;
        var size = 11 - 6 * arc + rnd(c, r, 4) * 3 * arc;
        var rot = (rnd(c, r, 5) - 0.5) * 140 * arc;
        var mid = rnd(c, r, 6) < 0.6 ? EMBER : ASH;
        var tgtPick = rnd(c, r, 7);
        var tgt = tgtPick < 0.14 ? EMBER : (tgtPick < 0.24 ? '#F4F1EB' : (tgtPick < 0.55 ? '#2A2623' : '#1F1C1A'));
        var col = t < 0.5 ? mix(srcColor(ySrc), mid, Math.min(1, t / 0.45)) : mix(mid, tgt, Math.min(1, (t - 0.5) / 0.45));
        var op = 0.55 + 0.45 * (1 - arc * 0.5);
        particles.push({ style: 'position:absolute;left:' + (x + jx).toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) + 'px;background:' + col + ';opacity:' + op.toFixed(2) + ';transform:rotate(' + rot.toFixed(0) + 'deg)' });
      }
    }
    var holes = [];
    for (var hc = 0; hc < 5; hc++) {
      for (var hr = 0; hr < 17; hr++) {
        var hx = 288 + hc * 12;
        if (rnd(hc, hr, 9) > 0.18 + hc * 0.16) continue;
        holes.push({ style: 'position:absolute;left:' + hx + 'px;top:' + (64 + hr * 12) + 'px;width:12px;height:12px;background:#141210' });
      }
    }
    var gridLines = [];
    for (var gl = 0; gl < 7; gl++) gridLines.push({ style: 'position:absolute;left:0;top:' + (92 + gl * 17) + 'px;width:290px;height:1px;background:#3A4466' });
    [56, 136, 200].forEach(function (gx) { gridLines.push({ style: 'position:absolute;left:' + gx + 'px;top:74px;width:1px;height:118px;background:#3A4466' }); });
    var nav = [];
    var navLens = [44, 30, 38, 0, 34, 40, 0, 36, 28];
    var ny = 54;
    for (var n = 0; n < navLens.length; n++) {
      if (navLens[n] === 0) { ny += 10; continue; }
      var active = n === 4;
      nav.push({
        row: active ? 'position:absolute;left:0;top:' + (ny - 4) + 'px;width:92px;height:16px;background:#2A2623;border-left:2px solid #E8642C;box-sizing:border-box' : 'position:absolute;left:0;top:0;width:0;height:0',
        icon: 'position:absolute;left:12px;top:' + ny + 'px;width:7px;height:7px;border:1px solid ' + (active ? '#E8642C' : '#8A837B'),
        bar: 'position:absolute;left:26px;top:' + (ny + 3) + 'px;width:' + navLens[n] + 'px;height:3px;background:' + (active ? '#F4F1EB' : '#6E6862')
      });
      ny += 18;
    }
    var kpis = [0, 1, 2].map(function (i) {
      var kx = 102 + i * 108;
      return {
        card: 'position:absolute;left:' + kx + 'px;top:40px;width:100px;height:50px;background:#FFFFFF;border:1px solid #E2DCD2;box-sizing:border-box',
        label: 'position:absolute;left:' + (kx + 8) + 'px;top:48px;width:30px;height:3px;background:#C9C2B7',
        value: 'position:absolute;left:' + (kx + 8) + 'px;top:58px;width:' + [56, 48, 52][i] + 'px;height:9px;background:#24211E',
        delta: 'position:absolute;left:' + (kx + 8) + 'px;top:74px;width:22px;height:5px;background:' + (i === 2 ? '#E8642C' : '#3FAE7A')
      };
    });
    var heights = [38, 34, 33, 46, 52, 55, 52, 62, 63, 70, 66, 80];
    var bars = heights.map(function (h, i) {
      return { style: 'position:absolute;left:' + (116 + i * 14.5).toFixed(1) + 'px;top:' + (210 - h) + 'px;width:9px;height:' + h + 'px;background:#E8642C' };
    });
    var avatarCols = ['#B4553A', '#4A6FA5', '#3E8E6E', '#7A5BA8'];
    var chipCols = ['#DDF1E6', '#F8E0D8', '#F8E0D8', '#E1E9F7'];
    var rows = [0, 1, 2, 3].map(function (i) {
      var ry = 110 + i * 26;
      return {
        line: i === 0 ? 'position:absolute;left:0;top:0;width:0;height:0' : 'position:absolute;left:306px;top:' + (ry - 6) + 'px;width:108px;height:1px;background:#EEE9E1',
        avatar: 'position:absolute;left:314px;top:' + ry + 'px;width:12px;height:12px;background:' + avatarCols[i],
        name: 'position:absolute;left:332px;top:' + (ry + 2) + 'px;width:' + [38, 44, 34, 46][i] + 'px;height:4px;background:#24211E',
        chip: 'position:absolute;left:378px;top:' + ry + 'px;width:28px;height:10px;background:' + chipCols[i]
      };
    });
    var build = [];
    var bx0 = 800, bw = 300, cell = 12;
    for (var bc = 0; bc * cell < bw; bc++) {
      var u = (bc * cell) / bw;
      var pHole = 0.92 * Math.pow(1 - u, 1.6) * dens;
      var pWire = 0.30 * Math.sin(Math.PI * Math.min(1, u * 1.4)) * dens;
      for (var br = 0; br < 20; br++) {
        var bx = bx0 + bc * cell, by = 44 + br * cell;
        if (by + cell > 277) continue;
        var a = rnd(bc, br, 21);
        if (a < pHole) {
          build.push({ style: 'position:absolute;left:' + bx + 'px;top:' + by + 'px;width:' + cell + 'px;height:' + cell + 'px;background:#141210' });
          if (rnd(bc, br, 22) < 0.22) {
            build.push({ style: 'position:absolute;left:' + (bx + 2) + 'px;top:' + (by + 2) + 'px;width:' + (cell - 4) + 'px;height:' + (cell - 4) + 'px;border:1px solid rgba(232,100,44,0.55);box-sizing:border-box' });
          }
        } else if (a < pHole + pWire) {
          build.push({ style: 'position:absolute;left:' + bx + 'px;top:' + by + 'px;width:' + cell + 'px;height:' + cell + 'px;background:#141210;border:1px solid #E8642C;box-sizing:border-box;opacity:0.9' });
        }
      }
    }
    for (var lt = 0; lt < 14; lt++) {
      var lx = 784 + rnd(lt, 0, 31) * 40;
      var ly = 40 + rnd(lt, 1, 31) * 230;
      var ls = 8 + rnd(lt, 2, 31) * 5;
      build.push({ style: 'position:absolute;left:' + lx.toFixed(1) + 'px;top:' + ly.toFixed(1) + 'px;width:' + ls.toFixed(1) + 'px;height:' + ls.toFixed(1) + 'px;background:' + (rnd(lt, 3, 31) < 0.5 ? '#E8642C' : '#2A2623') + ';transform:rotate(' + ((rnd(lt, 4, 31) - 0.5) * 30).toFixed(0) + 'deg)' });
    }
    build.push({ style: 'position:absolute;left:1100px;top:44px;width:1px;height:232px;background:rgba(232,100,44,0.35)' });
    build.push({ style: 'position:absolute;left:800px;top:43px;width:300px;height:1px;background:rgba(232,100,44,0.35)' });
    build.push({ style: 'position:absolute;left:800px;top:276px;width:300px;height:1px;background:rgba(232,100,44,0.35)' });
    return { particles: particles, holes: holes, gridLines: gridLines, nav: nav, kpis: kpis, bars: bars, rows: rows, build: build };
  }
}

(function () {
  var vals = new Component({"seed": 7, "density": 1}).renderVals();
  // Expand each <template data-for> once per item, filling {{item.key}} holes, in place.
  document.querySelectorAll("template[data-for]").forEach(function (tpl) {
    var as = tpl.dataset.as, html = tpl.innerHTML, out = "";
    (vals[tpl.dataset.for] || []).forEach(function (item) {
      out += html.replace(new RegExp("\\{\\{" + as + "\\.(\\w+)\\}\\}", "g"), function (_, k) { return item[k]; });
    });
    tpl.insertAdjacentHTML("beforebegin", out);
    tpl.remove();
  });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { document.body.dataset.ready = "1"; });
})();
</script>
</body>
</html>
