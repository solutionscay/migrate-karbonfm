<header class="topbar" data-tauri-drag-region>
  <div class="flex items-center gap-1">
    <button class="icon-btn" onclick="history.back()" aria-label="Back"><svg class="i"><use href="#i-chevron-left"/></svg></button>
    <button class="icon-btn" onclick="history.forward()" aria-label="Forward"><svg class="i"><use href="#i-chevron-right"/></svg></button>
  </div>
  <button class="searchbox" @click="$dispatch('open-palette')" aria-label="Search or jump to (Command K)">
    <svg class="i"><use href="#i-search"/></svg>
    <span class="text-[13px]">Search customers, invoices, activity…</span>
    <kbd>⌘K</kbd>
  </button>
  <div class="flex items-center gap-1">
    <div class="dropdown dropdown-end">
      <button tabindex="0" class="btn btn-primary btn-sm"><svg class="i i-sm"><use href="#i-plus"/></svg>New</button>
      <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-20 mt-2 w-52 p-1.5 border hairline shadow-lg text-[13px]">
        <li><a href="invoice.html"><svg class="i"><use href="#i-receipt"/></svg>Invoice</a></li>
        <li><a href="invoice.html"><svg class="i"><use href="#i-wallet"/></svg>Sales receipt</a></li>
        <li><a href="#" data-soon="New customer"><svg class="i"><use href="#i-user"/></svg>Customer</a></li>
        <li><a href="activity.html"><svg class="i"><use href="#i-task"/></svg>Task</a></li>
        <li><a href="activity.html"><svg class="i"><use href="#i-note"/></svg>Note</a></li>
      </ul>
    </div>
    <button class="icon-btn relative" aria-label="Notifications" data-soon="Notifications"><svg class="i"><use href="#i-bell"/></svg><span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-primary"></span></button>
    <button class="icon-btn" aria-label="Toggle dark mode" onclick="karbonTheme.toggle()">
      <svg class="i theme-sun"><use href="#i-sun"/></svg><svg class="i theme-moon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>
