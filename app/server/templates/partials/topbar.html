<header class="topbar">
  <div class="flex items-center gap-1">
    <button class="icon-btn" @click="history.back()" aria-label="Back"><svg class="i"><use href="#i-chevron-left"/></svg></button>
    <button class="icon-btn" @click="history.forward()" aria-label="Forward"><svg class="i"><use href="#i-chevron-right"/></svg></button>
  </div>
  <button class="searchbox" @click="$dispatch('open-palette')" aria-label="Search or jump to (Command K)">
    <svg class="i"><use href="#i-search"/></svg>
    <span class="text-[13px]">Search customers, invoices, activity…</span>
    <kbd>⌘K</kbd>
  </button>
  <div class="flex items-center gap-1">
    {# design/partials/topbar.html:13-19. Customer opens the create wizard (UI-05, with the duplicate check of
       BR-PARTY-02); the other items come in later releases and show the "not part of the demo yet" toast, as the
       sidebar's unbuilt screens do. #}
    <details class="dropdown dropdown-end">
      <summary class="btn btn-primary btn-sm"><svg class="i i-sm" aria-hidden="true"><use href="#i-plus"/></svg>New<svg class="i i-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg></summary>
      <ul class="dropdown-content menu bg-base-100 rounded-box z-20 mt-2 w-52 p-1.5 border hairline shadow-lg text-[13px]" aria-label="New">
        <li><button type="button" class="muted" data-soon="New invoice"><svg class="i" aria-hidden="true"><use href="#i-receipt"/></svg>Invoice<span class="ml-auto text-[11px]">Later</span></button></li>
        <li><button type="button" class="muted" data-soon="New sales receipt"><svg class="i" aria-hidden="true"><use href="#i-wallet"/></svg>Sales receipt<span class="ml-auto text-[11px]">Later</span></button></li>
        <li><a href="/parties/new?role=customer"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg>Customer</a></li>
        <li><button type="button" class="muted" data-soon="New task"><svg class="i" aria-hidden="true"><use href="#i-task"/></svg>Task<span class="ml-auto text-[11px]">Later</span></button></li>
        <li><button type="button" class="muted" data-soon="New note"><svg class="i" aria-hidden="true"><use href="#i-note"/></svg>Note<span class="ml-auto text-[11px]">Later</span></button></li>
      </ul>
    </details>
    <button class="icon-btn" aria-label="Toggle dark mode" @click="karbonTheme.toggle()">
      <svg class="i theme-sun"><use href="#i-sun"/></svg><svg class="i theme-moon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>
