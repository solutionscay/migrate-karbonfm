{# A write-only secret field (AP-03). The template gets only the name, the label and has_secret: the value is in the
   keychain and never reaches the page. Leaving the field empty keeps the saved secret. #}
<label class="block">
  <span class="text-[12px] muted">{{ label }}</span>
  <input type="password" name="{{ name }}" value="" class="input input-sm w-full mt-1" autocomplete="new-password"
         placeholder="{% if has_secret %}Saved. Type a new value to replace it.{% else %}Not set{% endif %}">
</label>
