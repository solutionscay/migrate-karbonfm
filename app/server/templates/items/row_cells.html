<tr id="item-{{ i.id }}" {% if i.oob %}hx-swap-oob="true"{% endif %}>
  <td><a class="link link-hover font-medium" href="#" hx-get="{{ i.edit_href }}" hx-target="#modal-body">{{ i.name }}</a></td>
  <td class="mono">{{ i.sku }}</td>
  <td class="truncate max-w-[320px] hidden xl:table-cell">{{ i.description }}</td>
  <td class="r num">{{ i.price }}</td>
  <td>{% if i.active %}<span class="chip ok"><span class="dot"></span>Active</span>{% else %}<span class="chip"><span class="dot"></span>Inactive</span>{% endif %}</td>
</tr>
