{% extends "base.html" %}
{% block title %}Items · KarbonFM{% endblock %}
{% block content %}
<div class="flex items-end justify-between gap-4 mb-5">
  <div>
    <div class="eyebrow mb-1.5">Sales</div>
    <h1 class="page-title">Items</h1>
  </div>
  <button type="button" class="btn btn-sm btn-primary" hx-get="/items/new" hx-target="#modal-body"><svg class="i i-sm" aria-hidden="true"><use href="#i-plus"/></svg>New item</button>
</div>
<section class="panel overflow-hidden" id="item-table">
  {{ table|safe }}
</section>
{% endblock %}
