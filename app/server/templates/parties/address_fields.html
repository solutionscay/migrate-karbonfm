{# The address fields of the contact-method dialog (OP-CONTACT-01). Included by parties/method_dialog.html and sent
   alone by GET /address-suggestions/pick (OP-INTEG-02), which swaps this block with the picked address. The including
   template gives `form` (line1 .. country) and `self.error(name)`. #}
<div id="address-fields" class="space-y-3">
  <label class="block">
    <span class="text-[12px] muted">Street</span>
    <input name="line1" value="{{ form.line1 }}" type="text" class="input input-sm w-full mt-1 {% if self.error("line1").is_some() %}input-error{% endif %}" autocomplete="off"
           {% if self.error("line1").is_some() %}aria-invalid="true" aria-describedby="err-line1"{% endif %}>
    {% if let Some(e) = self.error("line1") %}<span class="text-[12px] text-error" id="err-line1">{{ e }}</span>{% endif %}
  </label>
  <label class="block">
    <span class="text-[12px] muted">Line 2</span>
    <input name="line2" value="{{ form.line2 }}" type="text" class="input input-sm w-full mt-1 {% if self.error("line2").is_some() %}input-error{% endif %}" autocomplete="off"
           {% if self.error("line2").is_some() %}aria-invalid="true" aria-describedby="err-line2"{% endif %}>
    {% if let Some(e) = self.error("line2") %}<span class="text-[12px] text-error" id="err-line2">{{ e }}</span>{% endif %}
  </label>
  <div class="grid grid-cols-[1fr_70px_100px] gap-3">
    <label class="block">
      <span class="text-[12px] muted">City</span>
      <input name="city" value="{{ form.city }}" type="text" class="input input-sm w-full mt-1 {% if self.error("city").is_some() %}input-error{% endif %}" autocomplete="off"
             {% if self.error("city").is_some() %}aria-invalid="true" aria-describedby="err-city"{% endif %}>
      {% if let Some(e) = self.error("city") %}<span class="text-[12px] text-error" id="err-city">{{ e }}</span>{% endif %}
    </label>
    <label class="block">
      <span class="text-[12px] muted">State</span>
      <input name="state" value="{{ form.state }}" type="text" class="input input-sm w-full mt-1 {% if self.error("state").is_some() %}input-error{% endif %}" autocomplete="off"
             {% if self.error("state").is_some() %}aria-invalid="true" aria-describedby="err-state"{% endif %}>
      {% if let Some(e) = self.error("state") %}<span class="text-[12px] text-error" id="err-state">{{ e }}</span>{% endif %}
    </label>
    <label class="block">
      <span class="text-[12px] muted">Postal code</span>
      <input name="postal_code" value="{{ form.postal_code }}" type="text" class="input input-sm w-full mt-1 {% if self.error("postal_code").is_some() %}input-error{% endif %}" autocomplete="off"
             {% if self.error("postal_code").is_some() %}aria-invalid="true" aria-describedby="err-postal_code"{% endif %}>
      {% if let Some(e) = self.error("postal_code") %}<span class="text-[12px] text-error" id="err-postal_code">{{ e }}</span>{% endif %}
    </label>

  </div>
  <label class="block">
    <span class="text-[12px] muted">Country</span>
    <input name="country" value="{{ form.country }}" type="text" class="input input-sm w-full mt-1 {% if self.error("country").is_some() %}input-error{% endif %}" autocomplete="off"
           {% if self.error("country").is_some() %}aria-invalid="true" aria-describedby="err-country"{% endif %}>
    {% if let Some(e) = self.error("country") %}<span class="text-[12px] text-error" id="err-country">{{ e }}</span>{% endif %}
  </label>
</div>
