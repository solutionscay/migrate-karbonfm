{% extends "base.html" %}
{% block title %}People & organizations · KarbonFM{% endblock %}
{% block content %}
<div class="flex items-end justify-between gap-4 mb-5">
  <div>
    <div class="eyebrow mb-1.5">Contacts</div>
    <h1 class="page-title">People &amp; organizations</h1>
  </div>
  <div class="flex gap-2">
    <button class="btn btn-sm btn-quiet" hx-get="/parties/people/new" hx-target="#modal-body"><svg class="i i-sm" aria-hidden="true"><use href="#i-plus"/></svg>New person</button>
    <button class="btn btn-sm btn-quiet" hx-get="/parties/organizations/new" hx-target="#modal-body"><svg class="i i-sm" aria-hidden="true"><use href="#i-plus"/></svg>New organization</button>
  </div>
</div>

<section class="panel overflow-hidden" id="party-table">
  {{ table|safe }}
</section>
{% endblock %}
