{# OP-TEMPLATE-01 template_merge: the merged subject and body. Nothing is written. #}
{% if let Some(e) = error %}<div role="alert" class="alert alert-error alert-soft text-[13px] py-2">{{ e }}</div>{% endif %}
{% if let Some(m) = merged %}
<div class="rounded-box border hairline p-3 space-y-2" data-merged>
  <div class="text-[12px] muted">Subject</div>
  <div class="font-medium" data-merged-subject>{{ m.subject }}</div>
  <div class="text-[12px] muted">Body</div>
  <pre class="whitespace-pre-wrap text-[13px] font-sans" data-merged-message>{{ m.message }}</pre>
</div>
{% endif %}
