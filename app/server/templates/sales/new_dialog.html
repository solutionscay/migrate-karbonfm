{# New invoice or sales receipt: a customer is all it needs (kontacts 272, 514; BR-SALES-08). #}
<form hx-post="{{ action }}" hx-target="#modal-body">
  <div class="px-5 pt-4 pb-3 border-b hairline flex items-center">
    <h2 id="modal-title" class="font-semibold text-[15px]">{{ title }}</h2>
    <button type="button" class="icon-btn ml-auto" aria-label="Close" onclick="this.closest('dialog').close()"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="p-5 space-y-2">
    <div class="text-[12.5px] font-medium">Customer</div>
    {{ picker|safe }}
    {% if let Some(e) = error %}<p class="text-error text-[12px]" role="alert">{{ e }}</p>{% endif %}
  </div>
  <div class="px-5 py-3 border-t hairline flex justify-end gap-2">
    <button type="button" class="btn btn-sm btn-quiet" onclick="this.closest('dialog').close()">Cancel</button>
    <button class="btn btn-sm btn-primary">Create</button>
  </div>
</form>
