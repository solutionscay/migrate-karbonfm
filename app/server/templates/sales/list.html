{% extends "base.html" %}
{% block title %}Invoices & receipts · KarbonFM{% endblock %}
{% block content %}
<div class="flex items-end justify-between gap-4 mb-5">
  <div>
    <div class="eyebrow mb-1.5">Sales</div>
    <h1 class="page-title">Invoices &amp; receipts</h1>
  </div>
  <div class="flex gap-2">
    <button class="btn btn-sm btn-quiet" hx-get="/sales-receipts/new" hx-target="#modal-body"><svg class="i i-sm" aria-hidden="true"><use href="#i-wallet"/></svg>New sales receipt</button>
    <button class="btn btn-sm btn-primary" hx-get="/invoices/new" hx-target="#modal-body"><svg class="i i-sm" aria-hidden="true"><use href="#i-plus"/></svg>New invoice</button>
  </div>
</div>
<section class="panel overflow-hidden" id="sales-table">
  {{ table|safe }}
</section>
{% endblock %}
