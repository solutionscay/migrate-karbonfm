{# The customer picker of a new invoice or receipt (UI-06's pattern). #}
<div id="customer-picker">
  <label class="flex items-center gap-2 h-8 px-2.5 rounded-field border hairline bg-base-200/50 focus-within:border-primary">
    <svg class="i muted" aria-hidden="true"><use href="#i-search"/></svg>
    <input name="q" value="{{ q }}" class="bg-transparent outline-none w-full text-[13px]" placeholder="Search customers" aria-label="Search customers" autocomplete="off"
           hx-get="/pickers/customer?selected={{ selected|urlencode }}" hx-target="#customer-picker" hx-swap="outerHTML" hx-trigger="input changed delay:250ms">
  </label>
  <ul class="mt-2 max-h-56 overflow-y-auto" role="radiogroup" aria-label="Customers">
    {% for (id, name) in rows %}
    <li><label class="flex items-center gap-2.5 px-2 py-1.5 rounded-field hover:bg-base-200 cursor-pointer">
      <input type="radio" name="customer_id" value="{{ id }}" class="radio radio-xs" {% if *id == selected %}checked{% endif %}>
      <span class="truncate text-[13px]">{{ name }}</span>
    </label></li>
    {% else %}
    <li class="text-[12.5px] muted px-2 py-3">{% if q.is_empty() %}No customers yet.{% else %}No customer matches “{{ q }}”.{% endif %}</li>
    {% endfor %}
  </ul>
</div>
