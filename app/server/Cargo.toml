[package]
name = "karbon-server"
description = "The local axum server: routes, templates, database. No Tauri dependency, so it also runs in a browser for development."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Development only: serve the app in a browser, without the Tauri window.
name = "karbon-dev-server"
path = "src/bin/dev_server.rs"

[[bin]]
# Load a FileMaker export (one CSV per table) into a new database (OP-IMPORT-01).
name = "karbon-import"
path = "src/bin/import.rs"

[features]
# `karbon-dev-server --big-demo`: generate the synthetic FileMaker export (karbon-synth) and serve its import.
big-demo = ["dep:karbon-synth"]

[dependencies]
askama = "0.14"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
karbon-money.workspace = true
karbon-synth = { workspace = true, optional = true }
keyring = "4.2"
krilla = { version = "=0.7.0", default-features = false, features = ["simple-text"] }
printpdf = { version = "0.12.8", default-features = false, features = ["text_layout"] }
refinery = { version = "0.9.2", default-features = false, features = ["rusqlite"] }
regex = "1"
rusqlite.workspace = true
rustybuzz = "0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio.workspace = true
# secrets.toml, the opt-in secret file where there is no keychain (D-09, issue #7).
toml = "1.1"

[dev-dependencies]
http-body-util = "0.1"
karbon-synth.workspace = true
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
