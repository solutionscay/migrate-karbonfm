[workspace]
resolver = "2"
members = ["server", "desktop", "money"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
karbon-money = { path = "money" }
karbon-server = { path = "server" }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
