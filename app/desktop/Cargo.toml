[package]
name = "karbon-desktop"
description = "The Tauri shell: starts the local server and opens one window on it."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "karbonfm"

[[bin]]
name = "karbonfm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
karbon-server.workspace = true
# The native save dialog, called from Rust (as tauri-plugin-dialog does, without the plugin's page script).
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
tauri = { version = "2", features = [] }
# Only its open_path function; the plugin is not registered, so it adds nothing to the page.
tauri-plugin-opener = "2"
tokio.workspace = true

[features]
# Set by the Tauri CLI for release builds (serves frontendDist from the binary).
custom-protocol = ["tauri/custom-protocol"]
