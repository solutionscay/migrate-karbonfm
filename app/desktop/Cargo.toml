[package]
name = "karbon-desktop"
description = "The Tauri shell: starts the local server and opens one window on it."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "karbonfm"

[[bin]]
name = "karbonfm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
karbon-server.workspace = true
# The native save dialog (invoice PDF) and folder dialog (backup, restore), called from Rust: the dialog crate Tauri's
# dialog plugin uses, without the plugin or its page script, which reroutes alert() and confirm() through IPC.
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
tauri = { version = "2", features = [] }
# Only its open_path function; the plugin is not registered, so it adds nothing to the page.
tauri-plugin-opener = "2"
tokio.workspace = true

[features]
# The demo build loads 04_demo_seed.sql into a database that has no party yet (03, "Demo seed data").
default = ["demo"]
demo = []
# Set by the Tauri CLI for release builds (serves frontendDist from the binary).
custom-protocol = ["tauri/custom-protocol"]
