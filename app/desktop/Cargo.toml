[package]
name = "karbon-desktop"
description = "The Tauri shell: starts the local server and opens one window on it."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "karbonfm"

[[bin]]
name = "karbonfm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
karbon-server.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true

[features]
# Set by the Tauri CLI for release builds (serves frontendDist from the binary).
custom-protocol = ["tauri/custom-protocol"]
