[package]
name = "karbon-desktop"
description = "The Tauri shell: starts the local server and opens one window on it."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "karbonfm"

[[bin]]
name = "karbonfm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
karbon-server.workspace = true
# The native save dialog (invoice PDF) and folder dialog (backup, restore), called from Rust: the dialog crate Tauri's
# dialog plugin uses, without the plugin or its page script, which reroutes alert() and confirm() through IPC.
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
tauri = { version = "2", features = [] }
tokio.workspace = true

[features]
# The app ships on the big demo (owner decision 2026-11-01, 03 "Demo seed data"): when the data folder has no
# database, the first run generates the karbon-synth export and imports it (about 470 parties, 3,700 sales documents).
# An existing database is never replaced. `--no-default-features --features demo` gives the small 04_demo_seed.sql
# instead; `--no-default-features` gives an empty database that opens on setup.
default = ["big-demo"]
big-demo = ["karbon-server/big-demo"]
demo = []
# Set by the Tauri CLI for release builds (serves frontendDist from the binary).
custom-protocol = ["tauri/custom-protocol"]
