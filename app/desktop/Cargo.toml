[package]
name = "karbon-desktop"
description = "The Tauri shell: starts the local server and opens one window on it."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "karbonfm"

[[bin]]
name = "karbonfm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
karbon-server.workspace = true
# The native folder dialog for backup and restore, called from Rust: the same dialog crate Tauri's dialog plugin
# uses, without the plugin or its page script (as the save dialog on fix/pdf-view).
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
tauri = { version = "2", features = [] }
tokio.workspace = true

[features]
# The demo build loads 04_demo_seed.sql into a database that has no party yet (03, "Demo seed data").
default = ["demo"]
demo = []
# Set by the Tauri CLI for release builds (serves frontendDist from the binary).
custom-protocol = ["tauri/custom-protocol"]
