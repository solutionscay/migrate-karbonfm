[package]
name = "karbon-synth"
description = "Deterministic synthetic FileMaker export of KarbonFM (one CSV per base table, OD-03-01) for the importer (I3) and the big demo."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "karbon_synth"

[[bin]]
name = "karbon-synth-export"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
