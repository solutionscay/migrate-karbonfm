[package]
name = "karbon-smoke"
description = "WebDriver smoke test of the desktop window through tauri-driver (03 Test strategy, R-03): Windows and Linux in CI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "karbon-smoke"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde_json = "1"
# The W3C WebDriver calls to tauri-driver on 127.0.0.1: plain HTTP, no TLS.
ureq = { version = "3.4", default-features = false, features = ["json"] }
