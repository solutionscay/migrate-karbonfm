# KarbonFM desktop app (app/): CSS, checks and unsigned bundles on macOS, Windows and Linux from one codebase
# (02 recommendations; 03 Foundation gates; spikes S-01 and S-05). No Node toolchain anywhere.
name: app

on:
  push:
    paths: ["app/**", "migration/04_*.sql", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "migration/04_*.sql", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.4"

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  # S-05: the Tailwind standalone CLI with the vendored DaisyUI plugin builds the same CSS on every platform,
  # and the committed server/assets/app.css is what it builds.
  css:
    name: css (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build CSS (Tailwind standalone CLI + DaisyUI plugin)
        run: ./tools/build-css.sh
      - name: Committed CSS is up to date
        run: git diff --exit-code -- server/assets/app.css

  build:
    name: build (${{ matrix.name }})
    needs: css
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles app,dmg
            bundle-dir: app/target/universal-apple-darwin/release/bundle
          - name: Windows x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --bundles msi,nsis
            bundle-dir: app/target/release/bundle
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: --bundles appimage,deb
            bundle-dir: app/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview and bundling packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils

      # rust-toolchain.toml pins the compiler; rustup installs it on first use in app/.
      - name: Rust toolchain and targets
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (rules, routes, templates)
        run: cargo test --workspace --locked

      - name: Bundle (unsigned, OD-02-02)
        working-directory: app/desktop
        run: cargo tauri build ${{ matrix.tauri-args }} --ci

      - uses: actions/upload-artifact@v4
        with:
          name: KarbonFM-${{ runner.os }}
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/appimage/*.AppImage
            ${{ matrix.bundle-dir }}/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # 03 Test strategy (R-03): the desktop window under WebDriver, through tauri-driver. The app starts on a new temp
  # data folder (big demo), opens the dashboard and invoice INV-1048, checks the title and figures of the demo seed on
  # each, and uploads a screenshot of both (artifact smoke-<OS>). tauri-driver has no macOS support: the macOS window
  # stays on the manual checklist. The test itself is app/tools/smoke (karbon-smoke).
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAURI_DRIVER_VERSION: "2.1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview, WebKitWebDriver and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # WebKitWebDriver: webkit2gtk-driver up to Ubuntu 24.04, webkitgtk-webdriver from 26.04 (ubuntu-latest).
          driver=webkit2gtk-driver
          if apt-cache show webkitgtk-webdriver > /dev/null 2>&1; then driver=webkitgtk-webdriver; fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev "$driver" xvfb
          command -v WebKitWebDriver

      # The WebDriver of the WebView2 runtime the window uses (they must match). Edge's own driver on the runner is
      # the fallback: Edge and the WebView2 runtime are on the same version on the hosted images.
      - name: msedgedriver for the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          try {
            $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            $version = (Get-ItemProperty -Path $key).pv
            Write-Host "WebView2 runtime $version"
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir.zip"
            Expand-Archive "$dir.zip" -DestinationPath $dir -Force
            $driver = Join-Path $dir 'msedgedriver.exe'
          } catch {
            Write-Warning "no msedgedriver download for the WebView2 runtime ($_); using the runner's Edge driver"
            $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          }
          & $driver --version
          "MSEDGEDRIVER=$driver" >> $env:GITHUB_ENV

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Cache tauri-driver
        id: tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver*
          key: tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version "${TAURI_DRIVER_VERSION}" --locked

      # The binary cargo tauri build bundles (release, frontend served from the binary), without the bundling.
      - name: Build the app and the smoke test
        run: cargo build --release --locked -p karbon-desktop --features karbon-desktop/custom-protocol -p karbon-smoke

      # Windows diagnostics: the app on its own (no driver) for 20 s, on its own temp data folder. Says whether it is
      # still running or how it exited, with its log and stderr in the smoke artifact (direct-*.log).
      - name: Start the app directly (Windows diagnostics)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'direct-data'
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $data, $out | Out-Null
          $env:KARBONFM_DATA_DIR = $data
          $p = Start-Process -FilePath (Resolve-Path 'target\release\karbonfm.exe') -PassThru `
            -RedirectStandardOutput (Join-Path $out 'direct-stdout.log') -RedirectStandardError (Join-Path $out 'direct-stderr.log')
          if ($p.WaitForExit(20000)) {
            "karbonfm.exe EXITED with code $($p.ExitCode) (0x{0:X8}) after {1:N1} s" -f $p.ExitCode, ($p.ExitTime - $p.StartTime).TotalSeconds
          } else {
            "karbonfm.exe still RUNNING after 20 s"
            Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" | Select-Object -First 1 -ExpandProperty CommandLine
            Stop-Process -Id $p.Id -Force
          }
          $log = Join-Path $data 'logs\karbonfm.log'
          if (Test-Path $log) { Get-Content $log; Copy-Item $log (Join-Path $out 'direct-karbonfm.log') } else { "no karbonfm.log" }
          Get-Content (Join-Path $out 'direct-stderr.log') -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $p.StartTime } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'karbonfm|msedgewebview2' } | Select-Object -First 5 TimeCreated, Id, ProviderName, Message |
            Format-List

      - name: Smoke test (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          # A precaution: WebKitGTK's DMA-BUF renderer has drawn blank pages on GPU-less X servers. (A local
          # Ubuntu 24.04 container on Xvfb rendered both pages with and without it.)
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          ./target/release/karbon-smoke --app target/release/karbonfm --out "$RUNNER_TEMP/smoke"

      # Windows diagnostics while the smoke test runs: every 3 s for 90 s, the command lines of msedgedriver and
      # the window's WebView2 processes, and any DevToolsActivePort file (smoke artifact, watch.log).
      - name: Watch the WebDriver session (Windows diagnostics)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $watch = Join-Path $env:RUNNER_TEMP 'watch.ps1'
          @'
          $log = Join-Path $env:RUNNER_TEMP 'smoke\watch.log'
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          for ($i = 0; $i -lt 30; $i++) {
            "--- $(Get-Date -Format HH:mm:ss)" | Add-Content $log
            Get-CimInstance Win32_Process -Filter "Name = 'msedgedriver.exe' OR Name = 'karbonfm.exe' OR Name = 'msedgewebview2.exe'" |
              Where-Object { $_.Name -ne 'msedgewebview2.exe' -or $_.CommandLine -match 'webview-exe-name=karbonfm' -and $_.CommandLine -notmatch '--type=' } |
              ForEach-Object { "$($_.Name) [$($_.ProcessId)]: $($_.CommandLine)" } | Add-Content $log
            Get-ChildItem -Path $env:LOCALAPPDATA, $env:TEMP -Recurse -Filter DevToolsActivePort -ErrorAction SilentlyContinue |
              ForEach-Object { "DevToolsActivePort $($_.FullName): $((Get-Content $_.FullName) -join ' ')" } | Add-Content $log
            Start-Sleep -Seconds 3
          }
          '@ | Set-Content $watch
          Start-Process pwsh -ArgumentList '-NoProfile', '-File', $watch -WindowStyle Hidden

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: >-
          ./target/release/karbon-smoke.exe --app target/release/karbonfm.exe --native-driver "$MSEDGEDRIVER"
          --out "$RUNNER_TEMP/smoke"

      # What the window left behind when the session failed: the WebView2 DevTools port files and the processes.
      - name: Smoke diagnostics (Windows, on failure)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:LOCALAPPDATA, $env:TEMP -Recurse -Filter DevToolsActivePort -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName): $(Get-Content $_.FullName -Raw)" }
          Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'com.solutionscay.karbonfm') -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName
          Get-Process karbonfm, msedgewebview2, msedgedriver, tauri-driver -ErrorAction SilentlyContinue |
            Select-Object Name, Id, StartTime, Path | Format-Table -AutoSize
          Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" -ErrorAction SilentlyContinue |
            Select-Object -First 3 -ExpandProperty CommandLine

      # Screenshots of both pages, summary.txt, the app's karbonfm.log and tauri-driver.log; also when a check failed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 14
